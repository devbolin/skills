name: pack-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic structure check
        run: |
          test -f templates/phase1/skills-devtools/pack.yaml
          test -f templates/phase1/skills-devtools/skills/code-review/SKILL.md

      - name: Validate JSON files
        run: |
          python3 -m json.tool templates/phase1/catalog/index.json > /dev/null
          python3 -m json.tool templates/phase1/catalog/skills/code-review.json > /dev/null

      - name: Placeholder tests
        run: |
          echo "Add per-pack and per-skill tests"
