name: pack-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python3 -m pip install pyyaml yamllint

      # ============================================
      # 1. YAML Syntax Validation
      # ============================================
      - name: Validate YAML syntax
        run: |
          yamllint -d relaxed templates/phase1/**/*.yaml templates/phase1/**/.github/workflows/*.yml || true
          yamllint templates/phase1/**/*.yaml templates/phase1/**/.github/workflows/*.yml

      # ============================================
      # 2. Pack.yaml Structure Validation (all packs)
      # ============================================
      - name: Validate pack.yaml structure for all packs
        run: |
          python3 << 'PYTHON_SCRIPT'
          import yaml
          import json
          import os
          import sys
          import glob

          # Find all pack.yaml files
          pack_files = glob.glob("templates/phase1/*/pack.yaml")

          if not pack_files:
              print("ERROR: No pack.yaml files found in templates/phase1/*/")
              sys.exit(1)

          print(f"Found {len(pack_files)} pack(s): {[p.split('/')[2] for p in pack_files]}")

          all_errors = []

          for pack_yaml_path in pack_files:
              pack_dir = os.path.dirname(pack_yaml_path)
              pack_name = pack_dir.split('/')[-1]

              if not os.path.exists(pack_yaml_path):
                  all_errors.append(f"[{pack_name}] {pack_yaml_path} not found")
                  continue

              with open(pack_yaml_path, 'r') as f:
                  pack = yaml.safe_load(f)

              errors = []

              # Required top-level fields
              required_fields = ['id', 'name', 'version', 'owners', 'distribution', 'defaults', 'skills']
              for field in required_fields:
                  if field not in pack:
                      errors.append(f"Missing required field: {field}")

              # Pack ID format validation (prevent path traversal)
              pack_id = pack.get('id', '')
              import re
              if not re.match(r'^[a-zA-Z0-9_-]+$', pack_id):
                  errors.append(f"Pack id must match '^[a-zA-Z0-9_-]+$', got: '{pack_id}'")

              # Distribution fields
              if 'distribution' in pack:
                  dist = pack['distribution']
                  if 'default' not in dist:
                      errors.append("Missing distribution.default")
                  if 'enable_skill_artifacts' not in dist:
                      errors.append("Missing distribution.enable_skill_artifacts")
                  if dist.get('default') not in ['plugin', 'skill']:
                      errors.append(f"distribution.default must be 'plugin' or 'skill', got: {dist.get('default')}")

              # Skills array validation
              if 'skills' in pack:
                  for i, skill in enumerate(pack['skills']):
                      for field in ['id', 'path', 'mode', 'entry']:
                          if field not in skill:
                              errors.append(f"skills[{i}]: missing required field '{field}'")

                      if 'mode' in skill and skill['mode'] not in ['prompt']:
                          errors.append(f"skills[{i}]: mode must be 'prompt' for Phase 1, got: {skill.get('mode')}")

              # Agents array validation (if present)
              if 'agents' in pack:
                  for i, agent in enumerate(pack['agents']):
                      for field in ['id', 'path']:
                          if field not in agent:
                              errors.append(f"agents[{i}]: missing required field '{field}'")

              if errors:
                  all_errors.append(f"[{pack_name}] pack.yaml errors:")
                  for e in errors:
                      all_errors.append(f"  - {e}")
              else:
                  print(f"[{pack_name}] pack.yaml structure validation PASSED")

          if all_errors:
              print("PACK.YAML VALIDATION ERRORS:")
              for e in all_errors:
                  print(f"  {e}")
              sys.exit(1)

          print("All pack.yaml structure validations PASSED")

          PYTHON_SCRIPT

      # ============================================
      # 3. SKILL.md Frontmatter Validation (all packs)
      # ============================================
      - name: Validate SKILL.md frontmatter for all packs
        run: |
          python3 << 'PYTHON_SCRIPT'
          import yaml
          import os
          import sys
          import re
          import glob

          # Find all pack.yaml files
          pack_files = glob.glob("templates/phase1/*/pack.yaml")

          all_errors = []
          all_warnings = []

          for pack_yaml_path in pack_files:
              pack_dir = os.path.dirname(pack_yaml_path)
              pack_name = pack_dir.split('/')[-1]

              with open(pack_yaml_path, 'r') as f:
                  pack = yaml.safe_load(f)

              for skill in pack.get('skills', []):
                  skill_id = skill['id']
                  entry = skill['entry']

                  # Construct path relative to pack directory
                  skill_md_path = os.path.join(pack_dir, entry)

                  if not os.path.exists(skill_md_path):
                      all_errors.append(f"[{pack_name}] skill '{skill_id}': SKILL.md not found: {skill_md_path}")
                      continue

                  # Read and parse frontmatter
                  with open(skill_md_path, 'r') as f:
                      content = f.read()

                  # Extract frontmatter
                  fm_match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
                  if not fm_match:
                      all_errors.append(f"[{pack_name}] skill '{skill_id}': No frontmatter found in {entry}")
                      continue

                  try:
                      fm = yaml.safe_load(fm_match.group(1))
                  except Exception as e:
                      all_errors.append(f"[{pack_name}] skill '{skill_id}': Invalid frontmatter YAML: {e}")
                      continue

                  # Check required frontmatter fields (per agentskills.io spec)
                  required_fm = ['name', 'description']
                  for field in required_fm:
                      if field not in fm:
                          all_errors.append(f"[{pack_name}] skill '{skill_id}': Missing frontmatter field '{field}'")

                  # Validate optional version in metadata (not top-level)
                  if 'version' not in fm and ('metadata' not in fm or 'version' not in fm.get('metadata', {})):
                      all_warnings.append(f"[{pack_name}] skill '{skill_id}': version not found in frontmatter or metadata")

                  # Validate name matches
                  if 'name' in fm and fm['name'] != skill_id:
                      all_warnings.append(f"[{pack_name}] skill '{skill_id}': frontmatter name '{fm['name']}' differs from skill id '{skill_id}'")

              print(f"[{pack_name}] SKILL.md validation completed for {len(pack.get('skills', []))} skill(s)")

          if all_errors:
              print("SKILL.MD VALIDATION ERRORS:")
              for e in all_errors:
                  print(f"  - {e}")
              sys.exit(1)

          if all_warnings:
              print("WARNINGS:")
              for w in all_warnings:
                  print(f"  - {w}")

          print("All SKILL.md validations PASSED")

          PYTHON_SCRIPT

      # ============================================
      # 4. Skill Path Existence Check (all packs)
      # ============================================
      - name: Validate skill paths for all packs
        run: |
          python3 << 'PYTHON_SCRIPT'
          import yaml
          import os
          import sys
          import glob

          pack_files = glob.glob("templates/phase1/*/pack.yaml")

          all_errors = []

          for pack_yaml_path in pack_files:
              pack_dir = os.path.dirname(pack_yaml_path)
              pack_name = pack_dir.split('/')[-1]

              with open(pack_yaml_path, 'r') as f:
                  pack = yaml.safe_load(f)

              for skill in pack.get('skills', []):
                  skill_id = skill['id']
                  path = skill['path']
                  full_path = os.path.join(pack_dir, path)

                  if not os.path.exists(full_path):
                      all_errors.append(f"[{pack_name}] skill '{skill_id}': path does not exist: {path}")

                  # Check entry file exists
                  entry = skill['entry']
                  entry_path = os.path.join(pack_dir, entry)

                  if not os.path.exists(entry_path):
                      all_errors.append(f"[{pack_name}] skill '{skill_id}': entry file does not exist: {entry}")

              print(f"[{pack_name}] skill paths validation completed for {len(pack.get('skills', []))} skill(s)")

          if all_errors:
              print("PATH VALIDATION ERRORS:")
              for e in all_errors:
                  print(f"  - {e}")
              sys.exit(1)

          print("All skill paths validations PASSED")

          PYTHON_SCRIPT

      # ============================================
      # 5. JSON Syntax Validation
      # ============================================
      - name: Validate JSON files
        run: |
          python3 -m json.tool templates/phase1/catalog/index.json > /dev/null
          for f in templates/phase1/catalog/skills/*.json; do
            python3 -m json.tool "$f" > /dev/null || exit 1
          done
          echo "JSON validation PASSED"

      # ============================================
      # 6. Catalog Consistency Check (all packs)
      # ============================================
      - name: Validate catalog consistency with all packs
        run: |
          python3 << 'PYTHON_SCRIPT'
          import yaml
          import json
          import os
          import sys
          import glob

          pack_files = glob.glob("templates/phase1/*/pack.yaml")
          catalog_index_path = "templates/phase1/catalog/index.json"

          if not os.path.exists(catalog_index_path):
              print("WARNING: catalog/index.json not found, skipping catalog consistency check")
              sys.exit(0)

          with open(catalog_index_path, 'r') as f:
              catalog = json.load(f)

          # Collect all skills from all packs
          all_pack_skill_ids = set()
          pack_skill_map = {}  # skill_id -> pack_name

          for pack_yaml_path in pack_files:
              pack_dir = os.path.dirname(pack_yaml_path)
              pack_name = pack_dir.split('/')[-1]

              with open(pack_yaml_path, 'r') as f:
                  pack = yaml.safe_load(f)

              for skill in pack.get('skills', []):
                  skill_id = skill['id']
                  all_pack_skill_ids.add(skill_id)
                  pack_skill_map[skill_id] = pack_name

          catalog_skill_ids = {s['skill_id'] for s in catalog.get('skills', [])}

          errors = []

          # Note: We don't fail on missing_in_catalog because not all packs are meant to be in catalog
          # This is a warning-level check
          missing_in_catalog = all_pack_skill_ids - catalog_skill_ids
          extra_in_catalog = catalog_skill_ids - all_pack_skill_ids

          if missing_in_catalog:
              print(f"INFO: Skills in packs but not in catalog: {missing_in_catalog}")
          if extra_in_catalog:
              print(f"INFO: Skills in catalog but not in any pack: {extra_in_catalog}")

          # Validate catalog_entry paths exist
          catalog_dir = os.path.dirname(catalog_index_path)
          for skill in catalog.get('skills', []):
              catalog_entry = skill.get('catalog_entry')
              if catalog_entry:
                  entry_path = os.path.join(catalog_dir, catalog_entry)
                  if not os.path.exists(entry_path):
                      errors.append(f"catalog_entry not found: {catalog_entry} (for skill: {skill.get('skill_id')})")

          if errors:
              print("CATALOG CONSISTENCY ERRORS:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

          print("Catalog consistency validation PASSED")

          PYTHON_SCRIPT

      # ============================================
      # 7. Subagent Path Validation (all packs)
      # ============================================
      - name: Validate subagent paths for all packs
        run: |
          python3 << 'PYTHON_SCRIPT'
          import yaml
          import os
          import sys
          import re
          import glob

          pack_files = glob.glob("templates/phase1/*/pack.yaml")

          all_errors = []

          for pack_yaml_path in pack_files:
              pack_dir = os.path.dirname(pack_yaml_path)
              pack_name = pack_dir.split('/')[-1]

              with open(pack_yaml_path, 'r') as f:
                  pack = yaml.safe_load(f)

              if 'agents' not in pack:
                  print(f"[{pack_name}] No agents defined, skipping")
                  continue

              for agent in pack.get('agents', []):
                  agent_id = agent['id']
                  path = agent['path']

                  # Validate path format: must be agents/<id>.md
                  if not re.match(r'^agents/[a-zA-Z0-9_-]+\.md$', path):
                      all_errors.append(f"[{pack_name}] Agent '{agent_id}': path must match 'agents/<id>.md', got: '{path}'")
                      continue

                  full_path = os.path.join(pack_dir, path)

                  if not os.path.exists(full_path):
                      all_errors.append(f"[{pack_name}] Agent '{agent_id}': file does not exist: {path}")

              print(f"[{pack_name}] agent validation completed for {len(pack.get('agents', []))} agent(s)")

          if all_errors:
              print("AGENT PATH VALIDATION ERRORS:")
              for e in all_errors:
                  print(f"  - {e}")
              sys.exit(1)

          print("All agent path validations PASSED")

          PYTHON_SCRIPT

      # ============================================
      # 8. Placeholder for per-pack tests
      # ============================================
      - name: Run placeholder tests
        run: |
          echo "All structural validations PASSED"
          echo "Add per-pack and per-skill tests here"
