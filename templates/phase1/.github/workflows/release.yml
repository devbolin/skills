name: skill-release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package artifact
        run: |
          mkdir -p dist
          zip -r dist/invoice-extractor-1.0.0.zip templates/phase1/skills-finance/skills/invoice-extractor

      - name: Generate manifest/checksum
        run: |
          cat > dist/manifest.json <<'MANIFEST'
          {
            "skill_id": "invoice-extractor",
            "version": "1.0.0",
            "artifact": "invoice-extractor-1.0.0.zip"
          }
          MANIFEST
          (cd dist && shasum -a 256 invoice-extractor-1.0.0.zip > checksums.txt)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/invoice-extractor-1.0.0.zip
            dist/manifest.json
            dist/checksums.txt
