id: devtools-pack
name: DevTools Pack
version: 1.0.0
owners:
  - devtools-team

distribution:
  default: plugin
  enable_skill_artifacts: false

defaults:
  permissions:
    network: false
    connectors: []

skills:
  - id: code-review
    path: skills/code-review
    description: Automated code review for best practices, security, and performance
    mode: prompt
    entry: skills/code-review/SKILL.md
  - id: pr-summary
    path: skills/pr-summary
    description: Summarize pull requests, highlight risk, and list follow-up checks
    mode: prompt
    entry: skills/pr-summary/SKILL.md
  - id: test-plan
    path: skills/test-plan
    description: Generate focused test plans for code changes and release verification
    mode: prompt
    entry: skills/test-plan/SKILL.md

agents:
  - id: review-coordinator
    path: agents/review-coordinator.md
