id: devtools-pack
name: DevTools Pack
version: 1.0.0
owners:
  - devtools-team

distribution:
  default: plugin
  enable_skill_artifacts: false

defaults:
  permissions:
    network: false
    connectors: []

skills:
  - id: code-review
    path: skills/code-review
    description: Automated code review for best practices, security, and performance
    mode: prompt
    entry: skills/code-review/SKILL.md
